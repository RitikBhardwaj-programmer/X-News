name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # contextLoads starts the whole app (database, Kafka, API keys) and is
      # excluded: CI never gets real credentials. Unit tests use mocks.
      - name: Unit tests
        run: ./mvnw -B test -Dtest='!XNewsApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1
