spring.application.name=X News

# ==============================
# Configuration only - no secrets in this file.
# Every secret comes from an environment variable: Azure Container Apps
# secrets in production, your shell for local runs.
# ==============================

#database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway now owns schema changes - ddl-auto only checks entities match, never
# alters anything. baseline-on-migrate lets an existing hand-managed database
# (like this one) adopt Flyway without re-running V1 against it; a fresh
# database instead runs V1 for real and builds the schema from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# for local development (docker-compose Postgres):
#DATABASE_URL=jdbc:postgresql://localhost:15432/xnews
#DATABASE_USERNAME=postgres
#DATABASE_PASSWORD=postgres

server.port=8080

jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# Kafka - Confluent Cloud
# ==============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule \
  required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';

# ==============================
# Producer
# ==============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==============================
# Consumer
# ==============================
spring.kafka.consumer.group-id=xnews-processing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cfs.xnews.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.cfs.xnews.kafka.ArticleEvent

#Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# ai event properties
# The URL defaults to a local service so a dev run never calls production.
ai.event-matcher.url=${AI_EVENT_MATCHER_URL:http://localhost:8000}
ai.event-matcher.threshold=${AI_EVENT_MATCHER_THRESHOLD:0.94}
ai.event-matcher.candidate-limit=${AI_EVENT_MATCHER_CANDIDATE_LIMIT:30}
ai.event-matcher.api-key=${AI_SERVICE_API_KEY}
# v1 (default) | shadow (v1 decides, v2 runs and both decisions are stored)
# | v2 (v2 decides, falls back to v1 if its call fails). See V4 stage 1b.
ai.event-matcher.mode=${AI_EVENT_MATCHER_MODE:v1}

# Provenance (V4 roadmap step 1): the deployed image tag, baked into the
# image at build time; "local" on a developer machine.
xnews.code-version=${XNEWS_CODE_VERSION:local}

# Jev (TypeSafe AI) - structured classification/routing/scoring.
# Optional: without JEV_API_KEY, categories come from keyword rules.
ai.jev.url=https://api.typesafe.ai
ai.jev.api-key=${JEV_API_KEY:}
